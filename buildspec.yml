version: 0.2

env:
  variables:
    ECR_REPOSITORY: "react-fe"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      # Dynamically fetch your 12-digit AWS Account ID from the CodeBuild execution role
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}
      # FIX: Cleanly extract the first 7 characters of the commit hash using standard bash syntax
      - COMMIT_HASH=${CODEBUILD_RESOLVED_SOURCE_VERSION}
      - IMAGE_TAG=$(echo $COMMIT_HASH | cut -c1-7)
      # Authenticate Docker client against your private AWS ECR registry
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com

  build:
    commands:
      - echo Building React frontend Docker image...
      # Builds the image using the Dockerfile in your root folder (.)
      - docker build -t ${ECR_URI}:${IMAGE_TAG} .
      # Tags the newly built image as 'latest' for deployment ease
      - docker tag ${ECR_URI}:${IMAGE_TAG} ${ECR_URI}:latest

  post_build:
    commands:
      - echo Pushing Docker image to ECR...
      # Push both the unique commit-tagged version and the latest version to ECR
      - docker push ${ECR_URI}:${IMAGE_TAG}
      - docker push ${ECR_URI}:latest
      - echo Image pushed successfully:${ECR_URI}:${IMAGE_TAG}
